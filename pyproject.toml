[project]
name = "pv-grocy"
version = "0.1.0"
description = "Private Grocy MCP: an MCP server for a Grocy household (stock, shopping, recipes, meal plan, chores and more), read-only by default with opt-in writes"
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Happy Cynic Software LLC", email = "pv-grocy@happycynic.com" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/HappyCynic/pv-grocy"

[project.scripts]
pv-grocy = "pv_grocy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_grocy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: against a real Grocy (PV_GROCY_TEST_URL); run with -m live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "types-pyyaml>=6.0.12",
]
